name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run lint
        run: ruff check .

      - name: Run compile checks
        run: python -m compileall app tests scripts migrations

      - name: Run tests
        run: pytest -q

      - name: Run evaluation quality gate
        run: python scripts/check_eval_thresholds.py
